{% extends 'base.html'%}{% load static %}
<!--  -->
{% block head %}
<!-- heading here -->
<title>Shop Now</title>
<!--  -->
{% endblock %}
<!--  -->
{% block body %}
<!-- body here  -->
<!-- Hero Section with Big Banner -->
<section class="relative w-full">
  <img
    src="{% static 'images/banners/2.png' %}"
    alt="Big Banner"
    class="w-full h-96 object-cover opacity-30"
  />
  <div
    class="absolute inset-0 flex flex-col justify-center items-center text-white text-center bg-black bg-opacity-50"
  >
    <h1 class="text-5xl font-bold">Welcome to ShopNow</h1>
    <p class="mt-4 text-xl">Find the best products at unbeatable prices!</p>
    <a
      href="#products"
      class="mt-6 px-6 py-3 bg-white text-indigo-600 font-semibold rounded-md shadow-md hover:bg-indigo-100"
    >
      Shop Now
    </a>
  </div>
</section>

<!-- Products Section -->
<section id="products" class="py-16 bg-gray-500">
  <div class="max-w-screen-xl mx-auto px-4">
    <h2
      class="text-3xl font-bold text-center bg-gray-400 w-fit mx-auto py-2 px-5 shadow shaodw-3xl shadow-blue-400 rounded"
    >
      Our Products
    </h2>

    <div
      class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8 mt-8"
    >
      {% for i in loop %}
      <div class="bg-white shadow-lg rounded-lg p-4">
        <img
          src="https://picsum.photos/200/300?random={{i}}"
          alt="Product {{i}}"
          class="w-full h-48 object-cover rounded-lg"
        />
        <h3 class="mt-4 text-xl font-semibold text-gray-800">Product {{i}}</h3>
        <p class="mt-2 text-gray-600">$29.99</p>
        <button
          class="mt-4 px-4 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700"
        >
          Add to Cart
        </button>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
<!--  -->
{% endblock %}
